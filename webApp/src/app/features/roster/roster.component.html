<h1>Roster</h1>

<section>
  <h2>Jugadores</h2>
  <table class="roster-table">
    <thead>
      <tr>
        <th>#</th>
        <th>Galáctico</th>
        <th>Apodo</th>
        <th>WA Número</th>
        <th>Activo</th>
        <th>Socio Fundador</th>
        <th>Sede temp. anterior</th>
        <th></th>
      </tr>
    </thead>
    <tbody>
      @for (player of players(); track player.id) {
        <tr>
          <td><input type="number" [(ngModel)]="player.posicion" (change)="updatePlayer(player)" class="pos-input" [disabled]="!isAdmin" /></td>
          <td>{{ player.galactico }}</td>
          <td><input type="text" [(ngModel)]="player.bullying" (change)="updatePlayer(player)" [disabled]="!isAdmin" /></td>
          <td><input type="text" [(ngModel)]="player.wanumber" (change)="updatePlayer(player)" [disabled]="!isAdmin" /></td>
          <td><input type="checkbox" [(ngModel)]="player.activo" (change)="updatePlayer(player)" [disabled]="!isAdmin" /></td>
          <td><input type="checkbox" [(ngModel)]="player.socioFundador" (change)="updatePlayer(player)" [disabled]="!isAdmin" /></td>
          <td><input type="checkbox" [(ngModel)]="player.sedeTemporadaAnterior" (change)="updatePlayer(player)" [disabled]="!isAdmin" /></td>
          <td>@if (isAdmin) { <button type="button" (click)="removePlayer(player)">Eliminar</button> }</td>
        </tr>
      }
    </tbody>
  </table>

  @if (isAdmin) {
    <h3>Agregar jugador</h3>
    <form class="inline-form" (ngSubmit)="addPlayer()">
      <input type="text" name="galactico" placeholder="Galáctico (nombre)" [(ngModel)]="newPlayer.galactico" required />
      <input type="text" name="bullying" placeholder="Apodo" [(ngModel)]="newPlayer.bullying" />
      <input type="text" name="wanumber" placeholder="WA número" [(ngModel)]="newPlayer.wanumber" />
      <label><input type="checkbox" name="socioFundador" [(ngModel)]="newPlayer.socioFundador" /> Socio Fundador</label>
      <label><input type="checkbox" name="sedeTemporadaAnterior" [(ngModel)]="newPlayer.sedeTemporadaAnterior" /> Sede temp. anterior</label>
      <button type="submit">Agregar</button>
    </form>
  }
</section>
