<h1>Captura semanal</h1>

<div class="fecha-picker">
  <label>
    Fecha:
    <select [ngModel]="selectedFecha()" (ngModelChange)="onFechaChange($event)">
      @for (fecha of fechas(); track fecha) {
        <option [value]="fecha">{{ fecha }}</option>
      }
      @if (!fechas().includes(selectedFecha())) {
        <option [value]="selectedFecha()">{{ selectedFecha() }} (nueva)</option>
      }
    </select>
  </label>
  @if (isAdmin) {
    <label>
      Nueva fecha:
      <input type="date" [ngModel]="selectedFecha()" (ngModelChange)="createFecha($event)" />
    </label>
    <button type="button" (click)="deleteFecha()">Eliminar captura completa</button>
  }
</div>

<table class="capture-table">
  <thead>
    <tr>
      <th>Jugador</th>
      <th>RSVP</th>
      <th>Jugó</th>
      <th>Sede</th>
      <th>Pago</th>
      <th>Tarde</th>
      <th>Cupo ExPat</th>
      <th></th>
    </tr>
  </thead>
  <tbody>
    @for (row of rows(); track row.player.id) {
      <tr>
        <td>{{ row.player.galactico }}</td>
        <td><input type="checkbox" [(ngModel)]="row.record.rsvp" (change)="saveRow(row)" [disabled]="!isAdmin" /></td>
        <td><input type="checkbox" [(ngModel)]="row.record.jugo" (change)="saveRow(row)" [disabled]="!isAdmin" /></td>
        <td><input type="checkbox" [(ngModel)]="row.record.sede" (change)="saveRow(row)" [disabled]="!isAdmin" /></td>
        <td><input type="checkbox" [(ngModel)]="row.record.pago" (change)="saveRow(row)" [disabled]="!isAdmin" /></td>
        <td><input type="checkbox" [(ngModel)]="row.record.tarde" (change)="saveRow(row)" [disabled]="!isAdmin" /></td>
        <td>
          <input
            type="checkbox"
            [attr.aria-label]="'Cupo ExPat: ' + row.player.galactico"
            [ngModel]="row.record.cupoExPat ?? false"
            (ngModelChange)="row.record.cupoExPat = $event; saveRow(row)"
            [disabled]="!isAdmin"
          />
        </td>
        @if (isAdmin) {
          <td><button type="button" (click)="deleteRow(row)">Eliminar</button></td>
        }
      </tr>
    }
  </tbody>
</table>
